<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositories - Open Code Review Viewer</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="breadcrumb"><a href="/" class="nav-brand"><span class="brand-icon"></span>Open Code Review Viewer</a></nav>
<main class="repos-page">
<div class="repos-heading">
<h2>Repositories</h2>
{{if .Repos}}
<div class="repository-search">
    <label class="sr-only" for="repository-search-input">Search repositories</label>
    <input id="repository-search-input" type="search" placeholder="Search repositories" autocomplete="off">
</div>
{{end}}
</div>
{{if .Repos}}
<table id="repositories-table" class="table">
    <thead><tr><th>Repository</th><th>Sessions</th><th>Last Modified</th><th class="repos-action-col">Action</th></tr></thead>
    <tbody>
    {{range .Repos}}
        <tr>
            <td data-repository-name>{{.EncodedPath}}</td>
            <td>{{.SessionCount}}</td>
            <td>{{formatTime .LastModified}}</td>
            <td><a class="repo-check" href="/r/{{.EncodedPath}}">Check</a></td>
        </tr>
    {{end}}
    </tbody>
</table>
<nav id="repositories-pagination" class="repos-pagination" aria-label="Repository pages" hidden></nav>
<script src="/static/repos.js"></script>
{{else}}
<p>No session data found. Run a code review first.</p>
{{end}}
</main>
</body>
</html>
