<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositories - Open Code Review Viewer</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="breadcrumb"><a href="/" class="nav-brand"><span class="brand-icon"></span>Open Code Review Viewer</a></nav>
<main>
<h2>Repositories</h2>
{{if .Repos}}
<div class="repository-search">
    <label for="repository-search-input">Search repositories</label>
    <input id="repository-search-input" type="search" placeholder="Search repositories..." autocomplete="off">
</div>
<table id="repositories-table" class="table">
    <thead><tr><th>Repository</th><th>Sessions</th><th>Last Modified</th></tr></thead>
    <tbody>
    {{range .Repos}}
        <tr>
            <td data-repository-name><a href="/r/{{.EncodedPath}}">{{.EncodedPath}}</a></td>
            <td>{{.SessionCount}}</td>
            <td>{{formatTime .LastModified}}</td>
        </tr>
    {{end}}
    </tbody>
</table>
<script>
(() => {
    const input = document.getElementById("repository-search-input");
    const table = document.getElementById("repositories-table");
    if (!input || !table) return;

    const rows = table.querySelectorAll("tbody tr");
    input.addEventListener("input", () => {
        const query = input.value.trim().toLowerCase();
        rows.forEach((row) => {
            const nameCell = row.querySelector("[data-repository-name]");
            const name = nameCell ? nameCell.textContent.trim().toLowerCase() : "";
            row.hidden = !name.includes(query);
        });
    });
})();
</script>
{{else}}
<p>No session data found. Run a code review first.</p>
{{end}}
</main>
</body>
</html>
