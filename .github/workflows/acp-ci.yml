name: ACP CI

# acp/ is a nested Go module, so root CI does not build or test its packages.
on:
  push:
    branches: [main]
    paths:
      - 'acp/**'
      - '.github/workflows/acp-ci.yml'
      - '.gitattributes'
      - 'scripts/verify-license.sh'
      - 'scripts/verify-english-only.go'
  # Integration branch PRs need the same checks before they reach main.
  pull_request:
    paths:
      - 'acp/**'
      - '.github/workflows/acp-ci.yml'
      - '.gitattributes'
      - 'scripts/verify-license.sh'
      - 'scripts/verify-english-only.go'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 15
    container:
      image: golang:1.26.6
      options: --cpus=2
    steps:
      - uses: actions/checkout@v7

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Verify license headers
        run: bash scripts/verify-license.sh

      - name: Verify sources contain no unapproved non-English text
        working-directory: acp
        run: go run ../scripts/verify-english-only.go

      - name: Check formatting
        working-directory: acp
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean. Run 'gofmt -s -w .' and commit:"
            echo "$unformatted"
            gofmt -s -d .
            exit 1
          fi

      - name: Check line endings
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Line endings must be LF. Run 'git add --renormalize .' and commit the diff below."
            git diff --cached --stat
            exit 1
          fi

      # `git status --porcelain` rather than `git diff`: a newly created go.sum
      # is untracked, and `git diff` would not report it.
      - name: Check go.mod is tidy
        working-directory: acp
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' in acp/ and commit the diff below."
            git status --porcelain -- go.mod go.sum
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

      - name: Vet
        working-directory: acp
        run: go vet ./...

      - name: Staticcheck
        working-directory: acp
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck -version
          output="$(staticcheck ./... 2>&1)" || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q 'matched no packages'; then
            echo "::error::Staticcheck analyzed no packages."
            exit 1
          fi

      - name: Govulncheck
        working-directory: acp
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Test with coverage
        working-directory: acp
        run: |
          LC_ALL=C go test -v -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total: | awk '{print $3}'

      - name: Check coverage threshold
        working-directory: acp
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "::error::Could not parse total coverage from coverage.out."
            exit 1
          fi
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 90)}"; then
            echo "FAIL: Coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${COVERAGE}% meets 90% threshold"

      - name: Build
        working-directory: acp
        run: go build -o ../dist/ocr-acp ./cmd/ocr-acp

      # The Go container need not provide Python. uv provisions an isolated
      # Python runtime and the pinned official SDK; no OCR/LLM credentials.
      - name: Set up uv for official Python client
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.1'
          enable-cache: true
          cache-dependency-glob: acp/testdata/python-smoke-requirements.txt
          cache-suffix: python-3.12.13

      - name: Smoke test
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONOPTIMIZE: ''
        run: >-
          uv run --no-project --managed-python --python 3.12.13
          --with-requirements acp/testdata/python-smoke-requirements.txt
          acp/testdata/python-client-smoke.py

  cross-compile:
    runs-on: self-hosted
    timeout-minutes: 10
    container:
      image: golang:1.26.6
      options: --cpus=2
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v7

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: acp
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null ./...
