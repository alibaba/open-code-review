name: Pages CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'pages/**'

permissions:
  contents: read

concurrency:
  group: pages-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15
    container:
      image: node:24.18.0
    steps:
      - uses: actions/checkout@v7

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Install dependencies
        working-directory: pages
        run: npm install

      - name: Lint
        working-directory: pages
        run: npm run lint

      - name: Test
        working-directory: pages
        run: npm test

      - name: Typecheck
        working-directory: pages
        run: npm run typecheck

      - name: Build
        working-directory: pages
        run: npm run build

      - name: Validate sitemap
        working-directory: pages
        run: node scripts/validate-sitemap.cjs public/sitemap.xml

      - name: Smoke test
        working-directory: pages
        run: |
          FAILED=0
          LOCS=$(grep -oE '<loc>[^<]+</loc>' public/sitemap.xml | sed -E 's#<loc>https://open-codereview\.ai##; s#</loc>##')
          for loc in $LOCS; do
            file="dist/index.html"
            [ "$loc" != "/" ] && file="dist${loc}/index.html"
            if [ ! -f "$file" ]; then
              echo "FAIL: ${loc} — missing $file"
              FAILED=1
            else
              echo "OK: ${loc} -> $file"
            fi
          done

          npx serve dist -l tcp://127.0.0.1:3999 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          for loc in $LOCS; do
            if ! BODY=$(curl -sf "http://127.0.0.1:3999${loc}"); then
              echo "FAIL: ${loc} — not served with 200"
              FAILED=1
            elif ! echo "$BODY" | grep -q '\.bundle\.js'; then
              echo "FAIL: ${loc} — missing bundle reference"
              FAILED=1
            else
              echo "OK: ${loc}"
            fi
          done

          if curl -sf "http://127.0.0.1:3999/docs/does-not-exist" >/dev/null; then
            echo "FAIL: /docs/does-not-exist — expected 404"
            FAILED=1
          else
            echo "OK: /docs/does-not-exist -> 404"
          fi

          if ! curl -sf "http://127.0.0.1:3999/404.html" >/dev/null; then
            echo "FAIL: /404.html — static file not reachable"
            FAILED=1
          else
            echo "OK: /404.html"
          fi

          exit $FAILED

      - name: Check bundle size
        working-directory: pages
        run: npm run size
