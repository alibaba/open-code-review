name: Pages CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'pages/**'

permissions:
  contents: read

concurrency:
  group: pages-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 15
    container:
      image: node:24.18.0
    steps:
      - uses: actions/checkout@v7

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Install dependencies
        working-directory: pages
        run: npm install

      - name: Lint
        working-directory: pages
        run: npm run lint

      - name: Test
        working-directory: pages
        run: npm test

      - name: Typecheck
        working-directory: pages
        run: npm run typecheck

      - name: Build
        working-directory: pages
        run: npm run build

      - name: Smoke test
        working-directory: pages
        run: |
          npx serve dist -s -l tcp://127.0.0.1:3999 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          FAILED=0
          # `serve -s` rewrites SPA routes to index.html, so this verifies
          # the built shell is reachable and includes bundle references.
          for path in "/" "/docs/contributing" "/docs/quickstart" "/features"; do
            if ! BODY=$(curl -sf "http://127.0.0.1:3999${path}"); then
              echo "FAIL: ${path} — not reachable"
              FAILED=1
            elif ! echo "$BODY" | grep -q '\.bundle\.js'; then
              echo "FAIL: ${path} — missing bundle reference"
              FAILED=1
            else
              echo "OK: ${path}"
            fi
          done

          # Also check a real static file to ensure dist assets are served.
          if ! curl -sf "http://127.0.0.1:3999/404.html" >/dev/null; then
            echo "FAIL: /404.html — static file not reachable"
            FAILED=1
          else
            echo "OK: /404.html"
          fi

          exit $FAILED

      - name: Check bundle size
        working-directory: pages
        run: npm run size

  check-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Debug Docker Info
        run: docker info
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
            context: pages/
            push: false