name: VS Code Extension

on:
  pull_request:
    branches: [main]
    paths:
      - 'extensions/vscode/**'
      # The webview source lives in extensions/frontend and is built into the
      # VS Code extension via build:webview, so frontend changes must also
      # trigger this workflow.
      - 'extensions/frontend/**'
      - 'cmd/opencodereview/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'bin/ocr.js'
      - 'scripts/platform.js'
      - 'scripts/version.js'
      - '.github/workflows/vscode-ext.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 10
    container:
      image: node:24.22.1
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'
        working-directory: .

      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('extensions/vscode/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Compile
        run: yarn compile

      - name: Test
        run: yarn test

  windows-config:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Install Yarn
        run: npm install --global yarn@1.22.22 --ignore-scripts

      - name: Install dependencies
        working-directory: extensions/vscode
        run: yarn install --frozen-lockfile

      - name: Build CLI
        run: go build -o "$env:RUNNER_TEMP/ocr.exe" ./cmd/opencodereview

      - name: Test npm configuration lookup
        working-directory: extensions/vscode
        run: |
          $env:OCR_TEST_CLI = "$env:RUNNER_TEMP/ocr.exe"
          yarn test --runInBand --runTestsByPath src/extension/services/__tests__/ConfigService.npm.test.ts
