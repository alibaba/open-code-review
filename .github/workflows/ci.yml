name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**/LICENSE'
      - '**/.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**/LICENSE'
      - '**/.gitignore'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-presets-autofix:
    # Keep the test job on the merge ref with read-only permissions. Autofix
    # must create its commit from the contributor's exact PR head instead.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    container:
      image: golang:1.26.6
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Regenerate provider presets
        id: provider-presets-generate
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          generated=extensions/vscode/src/shared/providers.generated.ts
          # Require fresh output, even when go generate finds no directive.
          rm -f -- "$generated"
          go generate ./internal/llm
          if [[ ! -f "$generated" || -L "$generated" ]]; then
            echo "::error::Provider generation produced no regular catalog. Ensure the generator from #1221 is present."
            exit 1
          fi
          git add --force -- "$generated"
          if ! git diff --quiet HEAD -- . ":(exclude)$generated" ||
             [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo "::error::Generation changed files outside the provider catalog; refusing to commit."
            exit 1
          fi
          if [[ "$(git ls-files --stage -- "$generated")" != "100644 "* ]]; then
            echo "::error::The generated catalog must have ordinary file permissions."
            exit 1
          fi
          if git diff --cached --quiet -- "$generated"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit provider presets to the PR branch
        id: provider-presets-commit
        if: steps.provider-presets-generate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TRACE: '0'
          GIT_TRACE_CURL: '0'
          GIT_CURL_VERBOSE: '0'
        run: |
          set -euo pipefail
          generated=extensions/vscode/src/shared/providers.generated.ts
          : "${GH_TOKEN:?A repository token is required to push the catalog}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git diff --cached --name-only)" = "$generated"
          ref="refs/heads/$HEAD_REF"
          git check-ref-format "$ref"
          remote="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          current=$(git ls-remote --heads "$remote" "$ref" | cut -f1)
          if [[ "$current" != "$HEAD_SHA" ]]; then
            echo "::notice::The PR branch changed; skipping this outdated autofix."
            exit 0
          fi
          git -c core.hooksPath=/dev/null \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --no-gpg-sign --only -m "chore(vscode): regenerate provider presets" -- "$generated"
          test "$(git rev-parse HEAD^)" = "$HEAD_SHA"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          unset GH_TOKEN
          # The exact lease rejects concurrent advances, deletion and rewind.
          # The parent check above ensures an accepted update is a fast-forward.
          if ! GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${remote}.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git -c core.hooksPath=/dev/null -c credential.helper= \
              push "--force-with-lease=$ref:$HEAD_SHA" "$remote" "HEAD:$ref"; then
            echo "::error::Could not confirm the autofix push. Check the latest PR head, then run 'go generate ./internal/llm' and commit the catalog if needed."
            exit 1
          fi
          echo "::notice::Pushed the provider catalog. Checks must validate the new PR head; workflow approval may be required."

  test:
    runs-on: self-hosted
    timeout-minutes: 15
    container:
      image: golang:1.26.6
      options: --cpus=2
    steps:
      - uses: actions/checkout@v7

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Verify license headers
        run: bash scripts/verify-license.sh

      - name: Verify action pins
        run: bash scripts/verify-action-pins.sh

      - name: Verify sources contain no unapproved non-English text
        run: go run scripts/verify-english-only.go

      - name: Check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean. Run 'gofmt -s -w .' and commit:"
            echo "$unformatted"
            gofmt -s -d .
            exit 1
          fi
      
      - name: Check line endings
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "::error::Line endings must be LF. Run 'git add --renormalize .' and commit the diff below."
            git diff --cached --stat
            exit 1
          fi
        
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the diff above."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Test with coverage
        run: |
          go test -v -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | grep total: | awk '{print $3}'

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 90)}"; then
            echo "FAIL: Coverage ${COVERAGE}% is below 90% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${COVERAGE}% meets 90% threshold"

      - name: Build
        run: go build -o ./opencodereview ./cmd/opencodereview

      - name: Smoke test
        run: |
          ./opencodereview --version
          ./opencodereview --version | grep -q "open-code-review"
          HELP=$(./opencodereview --help)
          echo "$HELP" | grep -q "Commands:"
          echo "$HELP" | grep -q "review"
          echo "$HELP" | grep -q "scan"
          echo "$HELP" | grep -q "delegate"
          echo "$HELP" | grep -q "config"
          echo "$HELP" | grep -q "llm"
          echo "$HELP" | grep -q "viewer"
          echo "$HELP" | grep -q "session"
          echo "$HELP" | grep -q "rules"
          rm -f ./opencodereview

  # Runs the suite natively on Windows, which the cross-compile job below cannot
  # do: it only proves the windows arms of the build-tag splits compile. GitHub
  # does not support `container:` on Windows runners
  # (actions/runner#904), so this job installs Go directly instead of reusing the
  # golang:1.26.5 image the other jobs share.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Vet
        run: go vet ./...

      # No -race here: the race detector needs a working C toolchain on Windows,
      # and races are OS-independent, so the Linux job above already covers them.
      # This job is here for the OS-specific behavior instead. No coverage gate
      # either -- the //go:build !windows test files legitimately drop the total
      # below the 80% the Linux job enforces.
      - name: Test
        run: go test -count=1 ./...

      - name: Test Node launcher
        run: npm run test:launcher

      - name: Build
        run: go build -o opencodereview.exe ./cmd/opencodereview

      # Same assertions as the Linux smoke test, under git-bash so the script is
      # shared verbatim rather than reimplemented in PowerShell.
      - name: Smoke test
        shell: bash
        run: |
          ./opencodereview.exe --version
          ./opencodereview.exe --version | grep -q "open-code-review"
          HELP=$(./opencodereview.exe --help)
          echo "$HELP" | grep -q "Commands:"
          echo "$HELP" | grep -q "review"
          echo "$HELP" | grep -q "scan"
          echo "$HELP" | grep -q "delegate"
          echo "$HELP" | grep -q "config"
          echo "$HELP" | grep -q "llm"
          echo "$HELP" | grep -q "viewer"
          echo "$HELP" | grep -q "session"
          echo "$HELP" | grep -q "rules"
          rm -f ./opencodereview.exe

  cross-compile:
    runs-on: self-hosted
    timeout-minutes: 10
    container:
      image: golang:1.26.6
      options: --cpus=2
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v7

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o /dev/null ./...
