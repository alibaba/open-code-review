name: IDEA Extension

# Covers extensions/idea: unit tests and plugin.xml structure validation.
# -PskipFrontend=true skips the webview rebuild so the job needs no Node
# toolchain; the webview bundle itself is covered by frontend-ext.yml.
# The full IntelliJ Plugin Verifier (verifyPlugin) downloads IDE builds and
# runs for minutes, so it stays a release-grade check and out of the PR path.
# Also runs for shared frontend changes, which the host/frontend consistency
# tests read directly.

on:
  pull_request:
    branches: [main]
    paths:
      - 'extensions/idea/**'
      - 'extensions/frontend/**'
      - '.github/workflows/idea-ext.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/idea
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
        # No actions/cache for Gradle: this job runs on the self-hosted host
        # (no container), so ~/.gradle already persists between runs — the IDE
        # distribution is downloaded once and reused. Uploading a multi-GB
        # cache archive after every run only risks stalling the job.

      - name: Test
        run: ./gradlew test -PskipFrontend=true

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure -PskipFrontend=true
