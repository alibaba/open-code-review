name: Provider Presets Autofix

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/llm/**'
      - 'extensions/vscode/src/shared/providers.generated.ts'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/github-actions/autofix-provider-presets*'
      - '.github/workflows/provider-presets-autofix.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    # Fork and Dependabot tokens cannot push to contributor branches. The
    # independent CI regeneration check remains responsible for those PRs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
          cache: false

      - name: Test the autofix helper
        run: node scripts/github-actions/autofix-provider-presets.test.js

      - name: Regenerate provider presets
        run: go generate ./internal/llm

      - name: Commit provider presets to the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          OCR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          OCR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          OCR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OCR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/github-actions/autofix-provider-presets.js
