# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
pluginVersion=0.1.0
platformVersion=2025.1.4.1
# To build against a locally installed IDEA rather than the downloaded platform
# archive, set localIdePath in ~/.gradle/gradle.properties — not here: the path is
# machine-specific, so committing it breaks the build for anyone on another OS.
# For example:
#   macOS:   localIdePath=/Users/<you>/Applications/IntelliJ IDEA.app
#   Windows: localIdePath=D:/Program Files/IntelliJ IDEA 2025.2.1
# The local IDEA must be the same generation as platformVersion: crossing
# generations (2026.2, say) fails to compile on an incompatible Kotlin metadata
# version.
